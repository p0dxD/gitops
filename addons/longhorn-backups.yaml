# rendimiento add-on. Edit here or on the Add-ons page; pushes to the default branch sync it.
name: longhorn-backups
title: Longhorn backups
category: storage
description: Longhorn's backup target (Garage, in the garage namespace), the nightly Postgres volume backups, and the nightly backups of every other volume worth keeping.
namespace: longhorn-system
git:
  path: longhorn-backups
# Taken over from the ArgoCD app "longhorn-backups": the first sync only
# proceeds if it would change nothing that is running.
adopt: true
prune: true
