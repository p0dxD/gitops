# rendimiento add-on. Edit here or on the Add-ons page; pushes to the default branch sync it.
category: monitoring
createNamespace: true
description: 'Recibe las trazas de las aplicaciones con `observe` y las convierte en
  el grafo de servicios: llamadas por minuto, errores y latencia en cada línea del
  mapa del Universo.'
helm:
  chart: opentelemetry-collector
  repo: https://open-telemetry.github.io/opentelemetry-helm-charts
  version: 0.175.1
name: opentelemetry-collector
namespace: observa
prune: true
title: OpenTelemetry Collector
values:
  config:
    connectors:
      servicegraph:
        latency_histogram_buckets:
        - 1ms
        - 2ms
        - 5ms
        - 10ms
        - 25ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1s
        - 2500ms
        - 5s
        - 10s
        store:
          max_items: 5000
          ttl: 10s
        virtual_node_peer_attributes:
        - peer.service
        - db.system
        - db.name
        - server.address
        - net.peer.name
      spanmetrics:
        histogram:
          explicit:
            buckets:
            - 1ms
            - 2ms
            - 5ms
            - 10ms
            - 25ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2500ms
            - 5s
            - 10s
    processors:
      # Health checks (Kubernetes' probes, rendimiento's uptime checks) are
      # not traffic: without this every service gets a line from Internet.
      filter/health:
        error_mode: ignore
        traces:
          span:
          - IsMatch(attributes["user_agent.original"], "^(kube-probe|rendimiento-uptime)/")
          - IsMatch(attributes["http.user_agent"], "^(kube-probe|rendimiento-uptime)/")
    exporters:
      prometheusremotewrite:
        endpoint: http://vmsingle-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/write
      # Every span to rendimiento's traces service, which keeps whole
      # requests (the failed, the slow, a sample) for the Universe's
      # waterfall. When it is down, spans wait in a small queue and the
      # metrics above keep flowing.
      otlphttp/rendimiento:
        endpoint: http://rendimiento-traces.rendimiento-system.svc.cluster.local:4318
        compression: gzip
        sending_queue:
          queue_size: 2000
    receivers:
      jaeger: null
      prometheus: null
    service:
      pipelines:
        logs: null
        metrics:
          exporters:
          - prometheusremotewrite
          processors:
          - memory_limiter
          - batch
          receivers:
          - servicegraph
          - spanmetrics
        traces:
          exporters:
          - servicegraph
          - spanmetrics
          - otlphttp/rendimiento
          processors:
          - memory_limiter
          - filter/health
          - batch
          receivers:
          - otlp
          - zipkin
  image:
    repository: otel/opentelemetry-collector-contrib
  mode: deployment
  ports:
    jaeger-compact:
      enabled: false
    jaeger-grpc:
      enabled: false
    jaeger-thrift:
      enabled: false
    zipkin:
      enabled: true
  resources:
    limits:
      memory: 400Mi
    requests:
      cpu: 50m
      memory: 128Mi
