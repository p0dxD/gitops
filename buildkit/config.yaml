apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-pool-config
data:
  buildkitd.toml: |
    [registry."registry.cube.local:5000"]
      http = true
      insecure = true

    [worker.oci]
      gc = true
      # Units matter: BuildKit >= 0.17 reads a bare number as bytes (the old
      # gckeepstorage = 15000 meant 15 kB, so every build re-downloaded its
      # base images and cached layers). Each node's cache volume is 25Gi and
      # shares the node's disk.
      reservedSpace = "5GB"   # always keep at least this much cache
      maxUsedSpace = "15GB"   # never use more than this
      minFreeSpace = "15%"    # and always leave this much of the disk free
