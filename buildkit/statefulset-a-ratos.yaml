# The pool's daemons on the nodes «a ratos» (decision 196 in rendimiento's
# Ruta): amd64 machines on only when someone turns them on, one daemon on
# each. They tolerate the nodes' taint and nothing
# else lands there. rendimiento builds no image's
# main half on it (it is of the other architecture): only the amd64 half, at
# the same time as the arm64 one, and then joins both in one image. While the
# machine is off its pod is not ready, so it leaves the pool's SRV records
# and builds go on with the other one, or as before. One replica per machine:
# with one more machine, one more replica.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd-a-ratos
spec:
  serviceName: buildkitd-pool
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: buildkitd, pool: "true", a-ratos: "true" }
  template:
    metadata:
      # app=buildkitd is what the build namespace's NetworkPolicy allows; pool=true
      # puts it in the pool's Service.
      labels: { app: buildkitd, pool: "true", a-ratos: "true" }
    spec:
      nodeSelector:
        rendimiento.ai/construye: "si"
        kubernetes.io/arch: amd64
      # One per machine: each keeps its cache on its own disk (hostPath) and
      # stays bound to its node while it is off.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: buildkitd, a-ratos: "true" } }
              topologyKey: kubernetes.io/hostname
      tolerations:
        - { key: rendimiento.ai/a-ratos, operator: Exists, effect: NoSchedule }
        # Off for a while is the normal state of this node: stay bound to it.
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute }
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.18.2
          args: [--addr, "unix:///run/buildkit/buildkitd.sock", --addr, "tcp://0.0.0.0:1234", --config, /etc/buildkit/buildkitd.toml]
          securityContext: { privileged: true }
          ports: [{ containerPort: 1234, protocol: TCP }]
          readinessProbe:
            exec: { command: [buildctl, debug, workers] }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: cache, mountPath: /var/lib/buildkit }
            - { name: config, mountPath: /etc/buildkit }
      volumes:
        - name: config
          configMap: { name: buildkitd-pool-config }
        # A folder of the desktop's own disk: local-path's helper pod cannot
        # land on a node with the taint, and the cache outlives each power-off.
        - name: cache
          hostPath: { path: /var/lib/rendimiento-buildkit, type: DirectoryOrCreate }
