apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels: { app: garage }
  template:
    metadata:
      labels: { app: garage }
      annotations:
        # Restart when the config changes.
        rendimiento.ai/config-version: "1"
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.1.0
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          envFrom:
            - secretRef: { name: garage-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml }
            - { name: meta, mountPath: /var/lib/garage/meta }
            - { name: data, mountPath: /var/lib/garage/data }
      volumes:
        - name: config
          configMap: { name: garage-config }
  volumeClaimTemplates:
    - metadata: { name: meta }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources: { requests: { storage: 1Gi } }
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources: { requests: { storage: 20Gi } }
