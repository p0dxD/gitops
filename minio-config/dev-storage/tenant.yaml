apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: dev-storage
  namespace: minio-tenant
spec:
  name: dev-tenant
  requestAutoCert: true
  
  # Image: Use a specific, stable MinIO release image (as provided by user)
  image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    
  exposeServices:
    console: true
    minio: true
  credsSecret:
    name: "minio-root-secret"
    
  # Cluster Topology: Adjusted for Raspberry Pi / low-resource cluster
  pools:
    - name: "dev-pool"
      servers: 4 # Standard HA deployment uses 4+ servers
      volumeClaimTemplate:
        metadata:
          name: minio-data-prod
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 100Gi # Much larger storage requests
          selector: {}
      volumesPerServer: 2
      # Resources: Resource requests/limits for each server Pod - suitable for Pi 
      # (e.g., in a 4GB or 8GB RAM cluster)
      resources:
        requests:
          cpu: "50m" # Minimal CPU request
          memory: "256Mi"
        limits:
          cpu: "100m"
          memory: "512Mi" # Setting a reasonable memory limit
