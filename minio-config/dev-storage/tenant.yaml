apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: dev-storage
  namespace: minio-tenant
spec:
  requestAutoCert: true
  
  # Image: Use a specific, stable MinIO release image (as provided by user)
  image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    
  exposeServices:
    console: true
    minio: true
  configuration:
    name: storage-configuration
    
  # Cluster Topology: Adjusted for Raspberry Pi / low-resource cluster
  pools:
    - name: "dev-pool"
      servers: 3 # Standard HA deployment uses 4+ servers
      volumeClaimTemplate:
        apiVersion: v1
        kind: persistentvolumeclaims
        metadata: { }
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn
        status: { }
      volumesPerServer: 2
      # Resources: Resource requests/limits for each server Pod - suitable for Pi 
      # (e.g., in a 4GB or 8GB RAM cluster)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: minio
                topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "768Mi"
