apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-finder-ui
  namespace: route-finder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-finder-ui
  template:
    metadata:
      labels:
        app: route-finder-ui
    spec:
      containers:
        - name: ui
          image: registry.cube.local:5000/route-finder-ui:v1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
